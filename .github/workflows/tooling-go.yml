name: build
on:
  pull_request:
    paths:
      - '.github/workflows/tooling-go.yml'
      - '**/*.go'
      - go.mod
      - go.sum
      - 'frontend/**/*'
permissions:
    contents: read

env:
  golangciversion: v2.5.0

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v3
          - name: Set up Node.js
            uses: actions/setup-node@v4
            with:
              node-version: '20'
              cache: 'npm'
              cache-dependency-path: frontend/package-lock.json
          - name: Install frontend dependencies
            run: |
              cd frontend
              npm ci --legacy-peer-deps
          - name: Build frontend
            run: |
              cd frontend
              npm run build
          - name: Set up Go
            uses: actions/setup-go@v4
            with:
              go-version-file: 'go.mod'
              cache-dependency-path: subdir/go.sum
#          - name: Install Protoc
#            uses: arduino/setup-protoc@v2
#            with:
#                repo-token: ${{ secrets.GITHUB_TOKEN }}
          - name: Build
            run: go build ./...
          - name: Test
            run: go test ./...
          - name: golangci-lint
            uses: golangci/golangci-lint-action@v8
            with:
              version: ${{ env.golangciversion }}