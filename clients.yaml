clients:
  # Confidential client (server-side application)
  - id: "eqtestcopy"
    secret: "eqtestcopy-secret-key"
    name: "EQ Test Copy Client"
    client_type: "confidential"
    redirect_uris:
      - "https://localhost:3000/callback"
    grant_types:
      - "authorization_code"
      - "refresh_token"
    response_types:
      - "code"
    scopes:
      - "openid"
      - "profile"
      - "email"
    require_https: false  # Set to true in production

  # Public client (SPA/Mobile app) - no secret
  - id: "eqtestcopy-spa"
    name: "EQ Test Copy SPA"
    client_type: "public"
    redirect_uris:
      - "http://localhost:3000/callback"
      - "https://localhost:3000/callback"
    grant_types:
      - "authorization_code"
      - "refresh_token"
    response_types:
      - "code"
    scopes:
      - "openid"
      - "profile"
      - "email"
    require_https: false  # Set to true in production
    pkce_required: true   # PKCE required for public clients
